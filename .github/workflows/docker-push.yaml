name: Docker Push

on:
  push:
    branches:
      - dev-docker

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - { platform: linux/amd64,  goarch: amd64,  goarm: '', suffix: amd64 }
          - { platform: linux/arm64,  goarch: arm64,  goarm: '', suffix: arm64 }
          - { platform: linux/arm/v7, goarch: arm,    goarm: '7', suffix: armv7 }
          - { platform: linux/riscv64, goarch: riscv64, goarm: '', suffix: riscv64 }
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build ddns-go binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch.goarch }}
          GOARM: ${{ matrix.arch.goarm }}
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ddns-go .

      - name: Prepare zoneinfo
        run: cp -r /usr/share/zoneinfo .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS="${IMAGE}:${{ matrix.arch.suffix }}"
          if [ "${{ matrix.arch.suffix }}" = "amd64" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push (${{ matrix.arch.suffix }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ matrix.arch.platform }}
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
